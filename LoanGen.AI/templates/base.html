<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}LoanGen AI{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
{% block extra_head %}{% endblock %}
</head>
<body>

<nav class="navbar">
  <div class="container">
    <div class="nav-links">
      <a href="{{ url_for('home') }}" class="nav-link {{ 'active' if active=='home' else '' }}">Home</a>
      <a href="{{ url_for('prediction') }}" class="nav-link {{ 'active' if active=='prediction' else '' }}">Prediction</a>
      <a href="{{ url_for('data_overview') }}" class="nav-link {{ 'active' if active=='data-overview' else '' }}">Data Overview</a>
      <a href="{{ url_for('eda') }}" class="nav-link {{ 'active' if active=='eda' else '' }}">EDA</a>
    </div>
    <a href="{{ url_for('home') }}" class="nav-logo">
      <svg class="mark" viewBox="0 0 32 32" fill="none">
        <circle cx="16" cy="16" r="14" stroke="#474747" stroke-width="2.5"/>
        <path d="M16 2 A14 14 0 0 1 28.6 20" stroke="#22F89F" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="16" cy="16" r="4.5" fill="#22F89F"/>
      </svg>
      LoanGen<span class="ai-suffix">.AI</span>
    </a>
  </div>
</nav>

<main class="page">
{% block content %}{% endblock %}
</main>

<footer class="footer">
  <div class="container" style="display:flex; justify-content:space-between; align-items:center; width:100%;">
    <span>LoanGen<span class="ai-suffix">.AI</span> — instant loan approval intelligence</span>
    <span>Logistic Regression &amp; Decision Tree, trained &amp; served locally</span>
  </div>
</footer>

{% block scripts %}{% endblock %}
</body>
</html>
